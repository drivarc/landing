<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title data-i18n="error.404.title">404 - Siden ikke funnet | Drivarc</title>
    <meta name="description" content="Siden du søker etter finnes ikke eller er flyttet. Du kan gå tilbake til hovedsiden for å fortsette." data-i18n="error.404.desc" data-i18n-attr="content">

    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">

    <style>
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('/fonts/Inter-400.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 500;
            font-display: swap;
            src: url('/fonts/Inter-500.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 600;
            font-display: swap;
            src: url('/fonts/Inter-600.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url('/fonts/Inter-700.woff2') format('woff2');
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0B1120;
            --surface: #151D2E;
            --border: rgba(148, 163, 184, 0.08);
            --text: #E2E8F0;
            --text-muted: #64748B;
            --primary: #60A5FA;
            --primary-dark: #3B82F6;
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }



        .error-page {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 520px;
        }

        .error-logo {
            display: block;
            width: 80px;
            height: auto;
            margin: 0 auto 32px;
            opacity: 0;
            transform: translateY(16px) scale(0.92);
            animation: logoEnter 0.6s var(--ease-out) 0.1s forwards;
        }

        /* 404 — large, clean, no glow */
        .error-code {
            font-size: clamp(72px, 14vw, 112px);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 8px;
            opacity: 0;
            transform: translateY(12px);
            animation: enter 0.5s var(--ease-out) 0.2s forwards;
        }

        /* Gradient text — subtle, not neon */
        .error-code-accent {
            background: linear-gradient(135deg, var(--primary) 0%, #A78BFA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .error-label {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 24px;
            opacity: 0;
            transform: translateY(12px);
            animation: enter 0.5s var(--ease-out) 0.3s forwards;
        }

        .error-description {
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
            opacity: 0;
            transform: translateY(12px);
            animation: enter 0.5s var(--ease-out) 0.4s forwards;
        }

        .error-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            opacity: 0;
            transform: translateY(12px);
            animation: enter 0.5s var(--ease-out) 0.5s forwards;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--primary);
            color: var(--bg);
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            opacity: 0;
            transform: translateY(12px);
            animation: enter 0.5s var(--ease-out) 0.5s forwards;
            transition: transform 160ms var(--ease-out), box-shadow 160ms var(--ease-out), filter 160ms var(--ease-out);
            box-shadow: 0 2px 8px rgba(96, 165, 250, 0.15);
        }

        .btn-home:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 28px rgba(96, 165, 250, 0.35);
            filter: brightness(1.1);
        }

        .btn-home:active {
            transform: scale(0.97);
            transition-duration: 80ms;
            box-shadow: 0 1px 4px rgba(96, 165, 250, 0.2);
        }

        .btn-home svg {
            width: 18px;
            height: 18px;
        }



        @keyframes enter {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes logoEnter {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.92);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Accessibility: reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .error-logo,
            .error-code,
            .error-label,
            .error-description,
            .btn-home {
                animation: none;
                opacity: 1;
                transform: none;
            }
            .btn-home {
                transition: none;
            }
        }

        /* Light mode */
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #F8FAFC;
                --surface: #FFFFFF;
                --border: rgba(15, 23, 42, 0.06);
                --text: #0F172A;
                --text-muted: #64748B;
                --primary: #2563EB;
                --primary-dark: #1D4ED8;
            }
            .btn-home {
                color: #FFFFFF;
            }
            .btn-home:hover {
                box-shadow: 0 6px 20px rgba(37, 99, 235, 0.25);
            }
        }


    </style>
